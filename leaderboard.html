<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ORO Leaderboard — KiiChain Testnet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0b0d12;
    --card: #12151c;
    --border: #22262f;
    --text: #e8eaed;
    --muted: #8b909c;
    --accent: #6b46c1;
    --accent2: #9f7aea;
    --good: #34d399;
    --bad: #f87171;
    --gold: #f6c453;
    --silver: #c7ccd6;
    --bronze: #d38b5d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1a1330 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 8px; }
  header .logo {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    margin-bottom: 14px;
    box-shadow: 0 0 24px rgba(159, 122, 234, 0.45);
  }
  header h1 {
    font-size: 24px;
    margin: 0 0 6px;
    background: linear-gradient(90deg, var(--accent2), #d6bcfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: var(--muted); font-size: 14px; margin: 0; }

  .back-link {
    display: block;
    text-align: center;
    margin: 14px 0 28px;
    font-size: 13px;
  }
  .back-link a { color: var(--accent2); text-decoration: none; }

  .meta-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 22px;
  }
  .addr-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--muted);
  }

  .board {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .rank {
    width: 30px;
    font-weight: 700;
    font-size: 15px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .row:nth-child(1) .rank { color: var(--gold); }
  .row:nth-child(2) .rank { color: var(--silver); }
  .row:nth-child(3) .rank { color: var(--bronze); }
  .addr {
    flex: 1;
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bal {
    font-weight: 600;
    font-size: 14px;
    flex-shrink: 0;
  }
  .bal .unit { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 3px; }

  .status {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px 0;
  }
  .error { color: var(--bad); }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 30px;
    line-height: 1.6;
  }
</style>
</head>

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function shortAddr(addr) {
    return addr.slice(0, 6) + '...' + addr.slice(-4);
  }

  function timeAgo(dateStr) {
    if (!dateStr) return 'never';
    const diffMs = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.floor(hrs / 24)}d ago`;
  }

  async function loadLeaderboard() {
    const statusEl = document.getElementById('status');
    const boardEl = document.getElementById('board');

    try {
      const { data: meta } = await supabaseClient
        .from('oro_leaderboard_meta')
        .select('last_run_at')
        .eq('id', 1)
        .single();

      document.getElementById('lastUpdated').textContent =
        'Updated ' + timeAgo(meta?.last_run_at);

      const { data, error } = await supabaseClient
        .from('oro_leaderboard')
        .select('address, balance')
        .order('balance', { ascending: false })
        .gt('balance', 0)
        .limit(100);

      if (error) throw error;

      if (!data || data.length === 0) {
        statusEl.textContent = 'No holders indexed yet — the first scan may still be running.';
        return;
      }

      boardEl.innerHTML = data.map((row, i) => `
        <div class="row">
          <div class="rank">#${i + 1}</div>
          <div class="addr" title="${row.address}">${shortAddr(row.address)}</div>
          <div class="bal">${Number(row.balance).toLocaleString(undefined, {maximumFractionDigits: 2})}<span class="unit">ORO</span></div>
        </div>
      `).join('');

      statusEl.style.display = 'none';
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'Could not load leaderboard: ' + err.message;
      statusEl.className = 'status error';
    }
  }

  loadLeaderboard();
</script>
